<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIL · C++ / Unreal 학습 기록</title>
  <style>
    :root { --ink:#162131; --muted:#607084; --line:#dce4ee; --paper:#f7f9fc; --card:#fff; --blue:#2868c7; --soft:#eaf2ff; --shadow:0 12px 28px rgba(25,47,80,.07); }
    * { box-sizing:border-box; } html { scroll-behavior:smooth; } body { margin:0; background:var(--paper); color:var(--ink); font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; line-height:1.65; }
    .layout { display:grid; grid-template-columns:294px minmax(0,1fr); max-width:1480px; min-height:100vh; margin:auto; } aside { position:sticky; top:0; height:100vh; padding:30px 20px; overflow:auto; background:#fff; border-right:1px solid var(--line); }
    .brand { display:block; color:var(--ink); text-decoration:none; font-size:1.35rem; font-weight:850; letter-spacing:-.04em; } .brand small { display:block; margin-top:3px; color:var(--muted); font-size:.75rem; font-weight:600; letter-spacing:0; }
    .side-title { margin:32px 8px 9px; color:var(--muted); font-size:.72rem; font-weight:850; letter-spacing:.09em; text-transform:uppercase; } .tab-list,.project-list { display:grid; gap:4px; }
    .tab,.project { width:100%; padding:10px 11px; border:0; border-radius:9px; background:transparent; color:#526175; text-align:left; font:inherit; font-size:.9rem; cursor:pointer; } .tab:hover,.project:hover { background:#f2f6fb; color:var(--blue); } .tab[aria-selected="true"],.project[aria-pressed="true"] { background:var(--soft); color:#174f9d; font-weight:800; } .tab-count { float:right; color:#8290a1; font-size:.78rem; font-weight:700; }
    main { min-width:0; padding:52px clamp(22px,5vw,78px) 80px; } header { max-width:920px; padding:15px 0 35px; } .eyebrow { color:var(--blue); font-size:.82rem; font-weight:850; letter-spacing:.07em; text-transform:uppercase; } h1 { margin:7px 0 9px; font-size:clamp(2.25rem,5vw,4rem); letter-spacing:-.065em; line-height:1.04; } .intro { max-width:720px; margin:0; color:var(--muted); }
    .stats { display:flex; flex-wrap:wrap; gap:9px; margin-top:21px; } .stat { padding:6px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--muted); font-size:.82rem; } .stat strong { color:var(--ink); }
    .topic-head { max-width:920px; padding:20px 23px; border:1px solid #d5e3f8; border-radius:14px; background:linear-gradient(105deg,#eef5ff,#fff); } .topic-head h2 { margin:0; font-size:1.22rem; letter-spacing:-.035em; } .topic-head p { margin:5px 0 0; color:#51647b; font-size:.93rem; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; max-width:920px; margin-top:28px; padding:12px 0; border-bottom:1px solid var(--line); } .toolbar label,.count { color:var(--muted); font-size:.88rem; } select { margin-left:6px; padding:6px 25px 6px 8px; border:1px solid var(--line); border-radius:7px; background:#fff; font:inherit; font-size:.87rem; }
    .timeline { position:relative; max-width:920px; margin:25px 0 0; padding-left:27px; } .timeline:before { content:""; position:absolute; top:8px; bottom:8px; left:5px; width:2px; background:#d5dfed; } .record { position:relative; margin-bottom:16px; border:1px solid var(--line); border-radius:13px; background:var(--card); box-shadow:var(--shadow); transition:border-color .15s,box-shadow .15s; } .record:hover,.record:focus-within { border-color:#9fc2f4; background:#fbfdff; box-shadow:0 0 0 3px #b7d1fa,var(--shadow); } .record:before { content:""; position:absolute; top:29px; left:-28px; width:10px; height:10px; border:3px solid var(--blue); border-radius:50%; background:var(--paper); }
    .record-button { display:block; width:100%; height:100%; padding:21px 23px; border:0; border-radius:13px; background:transparent; color:inherit; text-align:left; font:inherit; cursor:pointer; } .record-button:hover,.record-button:focus-visible { outline:0; outline-offset:2px; background:transparent; } .record-meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px; color:var(--muted); font-size:.8rem; font-weight:700; } .topic-badge { padding:2px 7px; border-radius:5px; background:var(--soft); color:#245aa8; font-size:.72rem; } h3 { margin:7px 0 6px; font-size:1.18rem; letter-spacing:-.035em; line-height:1.35; } .summary { max-width:760px; margin:0; color:#536174; font-size:.92rem; } .more { display:inline-block; margin-top:12px; color:var(--blue); font-size:.84rem; font-weight:850; }.empty { padding:30px; border:1px dashed #bac6d6; border-radius:11px; color:var(--muted); text-align:center; }
    dialog { width:min(790px,calc(100% - 28px)); max-height:calc(100vh - 40px); padding:0; border:0; border-radius:16px; color:var(--ink); box-shadow:0 22px 70px rgba(17,32,52,.35); } dialog::backdrop { background:rgba(15,28,45,.58); } .detail-page { padding:31px; } .detail-top { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; } .detail-title { margin:4px 0 0; font-size:1.7rem; } #detailTitle:focus,#materialTitle:focus,#algorithmTitle:focus { outline:none; } .close { flex:0 0 auto; width:36px; height:36px; border:1px solid var(--line); border-radius:50%; background:#fff; color:var(--muted); font-size:1.2rem; cursor:pointer; } .detail-label { margin:9px 0 22px; color:var(--muted); font-size:.86rem; }
    .core { padding:17px 19px; border-left:4px solid var(--blue); border-radius:0 9px 9px 0; background:#f5f9ff; } .core h3,.section h3 { margin:0 0 5px; font-size:.92rem; } .core p,.section p { margin:0; color:#49586b; font-size:.94rem; white-space:pre-line; } .section { margin-top:22px; }.til-gallery { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr)); margin-top:12px; }.til-shot { margin:0; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:#f8fafc; }.til-shot a { display:block; }.til-shot img { display:block; width:100%; height:auto; max-height:520px; object-fit:contain; background:#111827; }.til-shot figcaption { padding:10px 12px; color:#536174; font-size:.84rem; line-height:1.5; }.extra { margin-top:25px; border-top:1px solid var(--line); } .extra summary { padding:16px 0; color:#4c5f75; font-size:.9rem; font-weight:800; cursor:pointer; }.extra-body { display:grid; gap:16px; padding:0 0 18px; }.extra ul { margin:5px 0 0; padding-left:21px; color:#516174; font-size:.92rem; }.source { color:var(--blue); font-size:.88rem; font-weight:800; text-decoration:none; }.source:hover { text-decoration:underline; }
    .note-body { max-width:760px; margin-top:28px; }.note-body p { margin:0 0 18px; color:#344255; font-size:1rem; white-space:pre-line; }.note-sources { display:flex; flex-wrap:wrap; gap:14px; margin-top:26px; padding-top:16px; border-top:1px solid var(--line); }
    .related { margin-top:28px; padding-top:20px; border-top:1px solid var(--line); }.related h3 { margin:0 0 9px; font-size:.96rem; }.related-list { display:flex; flex-wrap:wrap; gap:7px; }.related-button { padding:6px 9px; border:1px solid #d7e1ee; border-radius:7px; background:#fff; color:#365b8d; font:inherit; font-size:.8rem; cursor:pointer; }.related-button:hover { background:var(--soft); }
    @media (max-width:850px) { .layout { display:block; } aside { position:static; height:auto; padding:21px; border-right:0; border-bottom:1px solid var(--line); }.tab-list,.project-list { display:flex; flex-wrap:wrap; }.tab,.project { width:auto; padding:7px 9px; font-size:.82rem; }.side-title { margin-top:20px; } main { padding-top:30px; } }
    @media (max-width:500px) { main { padding:25px 17px 58px; }.timeline { padding-left:20px; }.record:before { left:-21px; }.record-button { padding:18px; }.detail-page { padding:22px; }.toolbar { align-items:flex-start; flex-direction:column; }.detail-title { font-size:1.4rem; } }
    [hidden] { display:none !important; } #articlePage { max-width:920px; } #articlePage .detail-page { padding:28px 0; } #articlePage .detail-title { font-size:clamp(1.6rem,3vw,2.5rem); } .section,.core,.extra { scroll-margin-top:24px; } #nearby .project { font-size:.8rem; } #nearby [aria-current="page"] { background:var(--soft); color:var(--blue); font-weight:800; }
  .date-range {max-width:920px;margin:0 0 24px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:#fff}.date-range legend{font-weight:700;font-size:.9rem}.date-range p{margin:0 0 10px;font-size:.8rem;color:var(--muted)}.date-range #dateMessage:empty{display:none}.date-range #dateMessage{margin:12px 0 0}.date-inputs{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.date-inputs label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}.date-inputs input,.date-inputs select{min-width:0;max-width:100%;margin:0;padding:8px;border:1px solid var(--line);border-radius:7px;font:inherit;color:var(--ink);background:white}.date-inputs>span{align-self:center}.date-inputs input[aria-invalid=true]{border-color:#b83434}.source,.project,.note-body,.material-section{overflow-wrap:anywhere}.article-notice{font-size:.82rem;color:var(--muted);margin:20px 0}.note-body pre{white-space:pre;overflow:auto}@media(max-width:500px){.date-range{padding:14px}.date-inputs{gap:8px}.date-inputs label{flex:1 1 110px}.date-inputs>span{display:none}.date-inputs button{width:100%}}
#sidebarFilters>summary{display:none} @media(max-width:850px){#sidebarFilters{margin-top:18px}#sidebarFilters>summary{display:list-item;cursor:pointer;font-size:.88rem;color:var(--blue);font-weight:700;padding:8px 0}#sidebarFilters .side-title{margin-top:14px}.tab-count{margin-left:5px}aside{padding:18px 20px}}
.library-grid .record{display:flex;flex-direction:column}.library-grid .record-button{height:auto;flex:1}.date-inputs input:disabled{background:var(--paper);color:var(--muted)}
</style>
</head>

  <div class="layout">
    <aside><a class="brand" href="#top">TIL <small>C++ / Unreal 학습 기록</small></a><details id="sidebarFilters" open><summary>주제·프로젝트 필터</summary><div class="side-title">학습 주제</div><div id="tabs" class="tab-list" role="tablist" aria-label="학습 주제"></div><div id="subnav" hidden><div class="side-title">세부 분류</div><div id="subtopics" class="project-list"></div></div><div id="articleNav" hidden><div class="side-title">이 글의 목차</div><div id="sections" class="project-list"></div><div class="side-title">같은 분류의 기록</div><div id="nearby" class="project-list"></div></div><div class="side-title">프로젝트로 좁히기</div><div id="projects" class="project-list"></div></details></aside>
    <main id="top"><div id="listPage"><header><div class="eyebrow">TIL</div><h1>공부하면서<br>적어둔 것들</h1><p class="intro">C++와 Unreal을 배우면서 막혔던 부분과 직접 만든 기능을 날짜별로 남겼습니다.</p><div class="stats"><span class="stat">기록 <strong id="total">—</strong>개</span><span class="stat">주제 <strong id="topicTotal">—</strong>개</span></div></header><fieldset class="date-range"><legend>날짜로 찾아보기</legend><p id="dateCoverage" class="library-notice"></p><div class="date-inputs"><label for="dateFrom">시작일<input type="date" id="dateFrom" aria-describedby="dateMessage"></label><span aria-hidden="true">~</span><label for="dateTo">종료일<input type="date" id="dateTo" aria-describedby="dateMessage"></label><label for="dateKind">날짜 구분<select id="dateKind"><option value="all">전체 기록</option><option value="undated">날짜 없는 메모</option><option value="project-period">프로젝트 전체 작업</option></select></label><button id="resetDates" type="button" class="related-button">날짜 초기화</button></div><p id="dateMessage" role="status"></p></fieldset><section class="topic-head"><h2 id="topicTitle">전체 기록</h2><p id="topicDescription"></p></section><section><div class="toolbar"><label>정렬 <select id="sort"><option value="desc">최신순</option><option value="asc">과거순</option></select></label><span id="count" class="count"></span></div><div id="records" class="timeline"></div></section></div><article id="articlePage" hidden aria-labelledby="detailTitle"><button id="backToList" class="related-button" type="button">← 목록으로</button><div id="detailContent" class="detail-page"></div></article></main>
  </div>
